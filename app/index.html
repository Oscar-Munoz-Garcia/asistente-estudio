<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Estudio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">📚 Mi Asistente de Estudio</h1>
        
        <!-- Configuración de Seguridad -->
        <div class="mb-6 p-4 bg-blue-50 rounded border border-blue-200">
            <label class="block text-sm font-bold text-gray-700 mb-2">Tu API Token de acceso:</label>
            <input type="password" id="api-key" placeholder="Pega tu token aquí..." class="w-full p-2 border rounded">
        </div>

        <!-- Subida de PDF -->
        <div class="mb-8">
            <h2 class="text-xl font-bold mb-3">1. Sube tus apuntes (PDF)</h2>
            <div class="flex gap-4">
                <input type="file" id="pdf-file" accept=".pdf" class="border p-2 rounded w-full">
                <button onclick="subirPDF()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Subir</button>
            </div>
            <p id="upload-status" class="text-sm mt-2 text-gray-600"></p>
        </div>

        <hr class="my-6">

        <!-- Zona de Preguntas -->
        <div>
            <h2 class="text-xl font-bold mb-3">2. Haz una pregunta</h2>
            <textarea id="pregunta" rows="3" class="w-full p-2 border rounded mb-3" placeholder="Ej: ¿Qué es la mitosis?"></textarea>
            <button onclick="preguntar()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition w-full font-bold">Preguntar al Asistente</button>
        </div>

        <!-- Respuesta -->
        <div class="mt-6">
            <h3 class="font-bold text-gray-700 mb-2">Respuesta:</h3>
            <div id="respuesta" class="bg-gray-50 p-4 border rounded min-h-[100px] whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        // Funciones JavaScript para conectar con tu API FastAPI
        async function subirPDF() {
            const token = document.getElementById('api-key').value;
            const fileInput = document.getElementById('pdf-file');
            const status = document.getElementById('upload-status');

            if (!token) { status.innerHTML = "⚠️ Falta el token"; return; }
            if (fileInput.files.length === 0) { status.innerHTML = "⚠️ Selecciona un archivo PDF"; return; }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            status.innerHTML = "⏳ Subiendo y procesando... esto puede tardar un poco.";
            
            try {
                const response = await fetch('/documentos/pdf', {
                    method: 'POST',
                    headers: { 'X-API-Key': token }, // Cambia esto si tu cabecera se llama distinto
                    body: formData
                });
                
                const data = await response.json();
                if (response.ok) {
                    status.innerHTML = `✅ ¡Éxito! ${data.mensaje}`;
                } else {
                    status.innerHTML = `❌ Error: ${data.detail}`;
                }
            } catch (error) {
                status.innerHTML = "❌ Error de conexión al servidor";
            }
        }

        async function preguntar() {
            const token = document.getElementById('api-key').value;
            const pregunta = document.getElementById('pregunta').value;
            const respuestaDiv = document.getElementById('respuesta');

            if (!token) { respuestaDiv.innerHTML = "⚠️ Falta el token"; return; }
            if (!pregunta) { respuestaDiv.innerHTML = "⚠️ Escribe una pregunta"; return; }

            respuestaDiv.innerHTML = "Pensando... 🧠";

            try {
                const response = await fetch('/preguntar', {
                    method: 'POST',
                    headers: { 
                        'X-API-Key': token,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ pregunta: pregunta })
                });

                const data = await response.json();
                if (response.ok) {
                    // Adaptar 'data.respuesta' según cómo devuelve tu API el texto
                    respuestaDiv.innerHTML = data.respuesta || JSON.stringify(data);
                } else {
                    respuestaDiv.innerHTML = `❌ Error: ${data.detail}`;
                }
            } catch (error) {
                respuestaDiv.innerHTML = "❌ Error al contactar con la API";
            }
        }
    </script>
</body>
</html>
