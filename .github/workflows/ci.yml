name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos minimos: el CI solo necesita leer el codigo
permissions:
  contents: read

# Si subes otro commit a la misma rama, cancela la ejecucion anterior (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t asistente-estudio .